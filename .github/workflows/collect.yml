name: Centinel Collect
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout Centinel Engine
        uses: actions/checkout@v4
        with:
          repository: VectisDev/centinel
          path: _engine
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: _engine/requirements-prod.txt

      - name: Install dependencies
        run: |
          pip install -q -r _engine/requirements-prod.txt
          pip install -q -e _engine

      - name: Run pipeline
        env:
          CENTINEL_COUNTRY: HN
          CENTINEL_YEAR: 2026
          CENTINEL_DATA_DIR: ${{ github.workspace }}/data
          PYTHONPATH: ${{ github.workspace }}/_engine/src
        run: |
          mkdir -p data hashes web/data
          cd _engine
          python scripts/run_pipeline.py --once || true
          python scripts/export_static_snapshot.py 2>/dev/null || true
          [ -f web/data/snapshot.json ] && cp web/data/snapshot.json ${{ github.workspace }}/web/data/ || true

      - name: Commit data
        run: |
          git config user.email "centinel-bot@users.noreply.github.com"
          git config user.name "Centinel Bot"
          git add data/ hashes/ web/data/ 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
          git push
